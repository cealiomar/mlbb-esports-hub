name: Coach data (daily)

# Once a day: harvest every official tournament's drafts, assign patches and
# publish data/coach/ for the Draft Coach iOS app. Separate from harvest.yml
# (hourly, for the website) so the app's data cadence is its own.
on:
  schedule:
    # 04:45 UTC sits between the website's :37 and :57 ticker runs; the shared
    # "pages" group below also queues this job behind the hourly full harvest
    # instead of hitting Liquipedia from two runners at once.
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Re-parse every tournament page, not only stale ones
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coach:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Harvest official tournaments and patch calendar
        env:
          COACH_MAX_PARSES: '110'
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then npm run coach:daily -- --full; else npm run coach:daily; fi

      - name: Validate before publishing
        run: npm run coach:test

      - name: Commit coach data
        run: |
          git config user.name  "mlbb-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/coach
          if git diff --staged --quiet; then
            echo "no data change"
          else
            git commit -m "chore: refresh coach data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
