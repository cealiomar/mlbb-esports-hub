name: Harvest Liquipedia

on:
  schedule:
    # Avoid the busy start of the hour. The two fast runs fetch only the
    # ticker; the hourly full run keeps standings, rosters and drafts current.
    - cron: '17 * * * *'
    - cron: '37,57 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh scope
        type: choice
        options: [full, matches]
        default: full

concurrency:
  # Share the Pages lock with deploy.yml so a scheduled refresh never races
  # a deployment started by a normal push.
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Harvest
        env:
          MATCHES_ONLY: ${{ github.event.schedule == '37,57 * * * *' || inputs.mode == 'matches' }}
        # Rotate by wall-clock hour, not run number: adding two ticker-only
        # runs must not make the full harvest revisit the same three regions.
        run: RUN_INDEX=$(($(date +%s) / 3600)) npm run harvest

      - name: Refresh patch catalog independently
        if: github.event.schedule != '37,57 * * * *' && inputs.mode != 'matches'
        continue-on-error: true
        run: npm run harvest:meta

      - name: Validate before publishing
        run: npm test -- lib/data lib/matches

      - name: Evaluate held-out draft results
        if: github.event.schedule != '37,57 * * * *' && inputs.mode != 'matches'
        run: npm run test:coach-evidence

      - name: Commit snapshots
        run: |
          git config user.name  "mlbb-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          # New team crests are downloaded during harvest and must ship with
          # the snapshot. Omitting public/teams makes them break after deploy.
          git add data/snapshots/matches.json data/snapshots/standings.json data/snapshots/teams.json data/snapshots/drafts.json data/snapshots/patch-meta.json public/teams public/heroes
          if git diff --staged --quiet; then
            echo "no data change"
          else
            git commit -m "chore: refresh Liquipedia snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # A push made with GITHUB_TOKEN deliberately does not start another
      # workflow. Build and deploy here so every hourly refresh reaches the
      # public site even when the snapshots changed.
      - name: Work out the base path
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build refreshed site
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
