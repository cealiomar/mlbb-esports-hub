name: Harvest Liquipedia

on:
  schedule:
    # Hourly. Four action=parse calls per run, 30s apart — far inside
    # Liquipedia's 1-per-30s ceiling, and fresh enough for a schedule site.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  # Share the Pages lock with deploy.yml so a scheduled refresh never races
  # a deployment started by a normal push.
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Harvest
        env:
          RUN_INDEX: ${{ github.run_number }}
        run: npm run harvest

      - name: Commit snapshots
        run: |
          git config user.name  "mlbb-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          # New team crests are downloaded during harvest and must ship with
          # the snapshot. Omitting public/teams makes them break after deploy.
          git add data/snapshots/matches.json data/snapshots/teams.json public/teams
          if git diff --staged --quiet; then
            echo "no data change"
          else
            git commit -m "chore: refresh Liquipedia snapshots"
            git push
          fi

      # A push made with GITHUB_TOKEN deliberately does not start another
      # workflow. Build and deploy here so every hourly refresh reaches the
      # public site even when the snapshots changed.
      - name: Work out the base path
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build refreshed site
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
